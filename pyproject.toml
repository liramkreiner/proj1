[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-penalty-shootout"
version = "1.0.0"
description = "Zero-sum penalty shootout simulator with a mixed-strategy Nash-equilibrium engine"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["game", "game_theory", "agents", "web", "web.backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
